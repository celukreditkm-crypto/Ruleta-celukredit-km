<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ruleta CELUKREDIT-KM</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="contenedor">

<img src="IMG-20260303-WA0062 (2).png" class="logo" alt="CELUKREDIT-KM">

<h1>🎡 RUEDA DE PREMIOS</h1>

<p>Completa tus datos y participa por increíbles premios.</p>

<form id="formulario">

<input
id="nombre"
type="text"
placeholder="Nombre completo"
required>

<input
id="cedula"
type="number"
placeholder="Número de cédula"
required>

<label class="check">
<input id="datos" type="checkbox" required>
Acepto el tratamiento de mis datos personales.
</label>

<button type="submit">
COMENZAR
</button>

</form>

<div id="ruleta-container">

<div class="puntero"></div>

<canvas id="ruleta" width="350" height="350"></canvas>

<button id="girar">
🎡 GIRAR
</button>

<h2 id="premio"></h2>

<a
id="whatsapp"
href="#"
target="_blank">
📲 Reclamar por WhatsApp
</a>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
